name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -MinimumVersion 1.21.0

      - name: PSScriptAnalyzer（Error / Warning）
        shell: pwsh
        run: |
          $paths = @('host', 'client', 'tools', 'tests')
          $results = @(foreach ($path in $paths) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
            })
          # 仓库根的一行安装引导脚本单独检查
          $results += @(Invoke-ScriptAnalyzer -Path ./bootstrap.ps1 -Settings ./PSScriptAnalyzerSettings.psd1)
          if ($results.Count -gt 0) {
            $results | Sort-Object ScriptName, Line | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
            throw "PSScriptAnalyzer 发现 $($results.Count) 个问题"
          }
          Write-Host 'PSScriptAnalyzer 通过'

  pester-pwsh:
    name: Pester（PowerShell 7）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0 -SkipPublisherCheck

      - name: 运行 Pester
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  pester-windows-powershell:
    name: Pester（Windows PowerShell 5.1）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Pester 5
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' })) {
            Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.5.0 -SkipPublisherCheck
          }

      - name: 运行 Pester
        shell: powershell
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Normal'
          Invoke-Pester -Configuration $config

  shell:
    name: shellcheck + compose config（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: shellcheck
        run: |
          shellcheck server/setup-rustdesk-server.sh
          shellcheck tests/setup-rustdesk-static.sh

      - name: 部署脚本静态检查（不实跑 docker）
        run: bash tests/setup-rustdesk-static.sh

      - name: docker compose config（逐服务断言）
        run: |
          # 只用 server/docker-compose.yml 一份文件（WebSocket 覆盖文件已删除）
          docker compose -f server/docker-compose.yml config > compose.rendered.yml
          cat compose.rendered.yml
          # host 网络 + 不发布端口：Docker 端口发布走 DNAT，会绕过 UFW 入站规则
          for service in hbbs hbbr; do
            block=$(awk -v svc="  $service:" '
              $0 == svc { inblock = 1; next }
              /^  [a-z]/ { inblock = 0 }
              inblock
            ' compose.rendered.yml)
            if [ -z "$block" ]; then
              echo "compose 里找不到服务 $service"
              exit 1
            fi
            echo "---- $service ----"
            echo "$block"
            echo "$block" | grep -qE '^[[:space:]]+network_mode:[[:space:]]+host[[:space:]]*$' || {
              echo "服务 $service 必须是 network_mode: host"
              exit 1
            }
            if echo "$block" | grep -qE '^[[:space:]]+ports:'; then
              echo "服务 $service 不应发布端口"
              exit 1
            fi
            if echo "$block" | grep -qE '^[[:space:]]+published:'; then
              echo "服务 $service 不应发布端口（published）"
              exit 1
            fi
          done

      - name: 部署脚本失败路径（非 root 应拒绝且无副作用）
        run: |
          set +e
          output=$(bash server/setup-rustdesk-server.sh 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "期望退出码 1，实际 $code"
            exit 1
          fi
          if [ -d server/data ]; then
            echo "非 root 运行时不应创建 data 目录"
            exit 1
          fi
