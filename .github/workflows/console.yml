name: Console

# 只在控制台目录或本工作流变更时触发，脚本 CI 不受影响。
on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console.yml"

permissions:
  contents: read

jobs:
  build:
    name: Tauri 构建（Windows，不打包安装器）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 仓库暂未提交 package-lock.json：有 lock 用 npm ci，没有则 npm install。
      - name: 安装前端依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: 构建（--no-bundle）
        run: npm run tauri build -- --no-bundle
