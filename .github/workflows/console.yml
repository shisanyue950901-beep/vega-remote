name: Console

# 只在控制台/被控端脚本或本工作流变更时触发，其他脚本 CI 不受影响。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "console/**"
      - "host/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - "host/**"
      - ".github/workflows/console.yml"

permissions:
  contents: read

jobs:
  build:
    name: Tauri 构建（Windows，NSIS 安装包）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    env:
      VEGA_UPDATER_PUBKEY: ${{ secrets.VEGA_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Tauri 直接把 capability JSON 交给 serde_json::from_str：带 UTF-8 BOM 会解析失败，
      # 构建在“上传安装包”之前就中止。这里先拦一道，错误信息比 Tauri 的报错更直接。
      - name: 校验 Tauri 配置与 capability 是合法无 BOM JSON
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          let failed = false;
          for (const file of process.argv.slice(1)) {
            const buf = fs.readFileSync(file);
            if (buf[0] === 0xef && buf[1] === 0xbb && buf[2] === 0xbf) {
              console.error("BOM found: " + file);
              failed = true;
              continue;
            }
            try {
              JSON.parse(buf.toString("utf8"));
              console.log("ok: " + file);
            } catch (err) {
              console.error("invalid JSON: " + file + " (" + err.message + ")");
              failed = true;
            }
          }
          if (failed) process.exit(1);
          ' src-tauri/tauri.conf.json src-tauri/capabilities/default.json

      - name: 注入更新公钥（配置了 secret 时）
        if: env.VEGA_UPDATER_PUBKEY != ''
        shell: bash
        run: |
          set -euo pipefail
          key=$(printf '%s' "$VEGA_UPDATER_PUBKEY" | sed -e 's/[\\&|]/\\&/g')
          sed -i "s|__VEGA_UPDATER_PUBKEY__|$key|" src-tauri/tauri.conf.json
          if grep -q '__VEGA_UPDATER_PUBKEY__' src-tauri/tauri.conf.json; then
            echo "::error::更新公钥注入失败"
            exit 1
          fi

      # 没有签名私钥时（PR / fork）关闭更新产物，构建仍要能过；tag 发布时由 secret 打开。
      - name: 无签名私钥时关闭更新产物
        if: env.TAURI_SIGNING_PRIVATE_KEY == '' || env.VEGA_UPDATER_PUBKEY == ''
        shell: bash
        run: |
          node -e '
          const fs = require("fs");
          const p = "src-tauri/tauri.conf.json";
          const conf = JSON.parse(fs.readFileSync(p, "utf8"));
          conf.bundle.createUpdaterArtifacts = false;
          fs.writeFileSync(p, JSON.stringify(conf, null, 2) + "\n");
          '
          echo "未配置 TAURI_SIGNING_PRIVATE_KEY / VEGA_UPDATER_PUBKEY：本次跳过更新签名产物"

      # 仓库暂未提交 package-lock.json / Cargo.lock：离线环境无法生成，先保留 npm install。
      # TODO(m2b): 在联网机器上生成并提交 package-lock.json 与 src-tauri/Cargo.lock，
      # 然后把这里换成 `npm ci`，构建步骤换成 Cargo `--locked`（或 tauri build -- --locked）。
      # 有 lock 时下面的分支已经会走 npm ci。
      - name: 安装前端依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # TODO(m2b): Cargo.lock 提交后追加 --locked，保证依赖可复现。
      # tauri.conf.json 里 bundle.targets = ["nsis"]，perMachine 只提权一次；
      # 安装包会带上 host/install-rustdesk.ps1 与 resources/vega-defaults.json。
      - name: 构建（NSIS 安装包）
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles nsis

      # cargo test 的 build.rs（generate_context!）需要 ../dist，上面构建已生成。
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 重命名安装包为 Vega-Setup.exe
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          mkdir -p "$RUNNER_TEMP/vega"
          cp "$src" "$RUNNER_TEMP/vega/Vega-Setup.exe"
          if compgen -G "src-tauri/target/release/bundle/nsis/*.sig" > /dev/null; then
            sig=$(ls src-tauri/target/release/bundle/nsis/*.sig | head -n 1)
            cp "$sig" "$RUNNER_TEMP/vega/Vega-Setup.exe.sig"
          fi
          ls -l "$RUNNER_TEMP/vega/"

      - name: 上传 Vega-Setup.exe（真机试跑用安装包）
        uses: actions/upload-artifact@v4
        with:
          name: vega-setup-windows
          path: ${{ runner.temp }}/vega/Vega-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: 上传更新签名产物
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: vega-updater-windows
          path: ${{ runner.temp }}/vega/Vega-Setup.exe*
          if-no-files-found: error
          retention-days: 7

      - name: 上传控制台 exe（供真机试跑）
        uses: actions/upload-artifact@v4
        with:
          name: vega-console-windows
          path: console/src-tauri/target/release/vega-console.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布更新清单（latest.json）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载签名产物
        uses: actions/download-artifact@v4
        with:
          name: vega-updater-windows
          path: dist

      - name: 生成 latest.json 与镜像清单
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sig_file="dist/Vega-Setup.exe.sig"
          if [ ! -f "$sig_file" ]; then
            echo "::error::缺少 Vega-Setup.exe.sig：请配置 TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          sig=$(cat "$sig_file")
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          notes="Vega 控制台 ${version}"
          gh_url="https://github.com/${REPO}/releases/download/${TAG}/Vega-Setup.exe"
          mirror_url="http://60.205.95.98/vega/updates/Vega-Setup.exe"

          jq -n --arg v "$version" --arg n "$notes" --arg d "$pub_date" \
            --arg s "$sig" --arg u "$gh_url" \
            '{version:$v,notes:$n,pub_date:$d,platforms:{"windows-x86_64":{signature:$s,url:$u}}}' \
            > latest.json
          jq -n --arg v "$version" --arg n "$notes" --arg d "$pub_date" \
            --arg s "$sig" --arg u "$mirror_url" \
            '{version:$v,notes:$n,pub_date:$d,platforms:{"windows-x86_64":{signature:$s,url:$u}}}' \
            > latest-mirror.json
          cat latest.json
          cat latest-mirror.json

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Vega-Setup.exe
            dist/Vega-Setup.exe.sig
            latest.json
            latest-mirror.json
