name: Console

# 只在控制台目录或本工作流变更时触发，脚本 CI 不受影响。
on:
  push:
    branches: [main]
    paths:
      - "console/**"
      - ".github/workflows/console.yml"
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/console.yml"

permissions:
  contents: read

jobs:
  build:
    name: Tauri 构建（Windows，不打包安装器）
    runs-on: windows-latest
    defaults:
      run:
        working-directory: console
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 仓库暂未提交 package-lock.json / Cargo.lock：离线环境无法生成，先保留 npm install。
      # TODO(m2b): 在联网机器上生成并提交 package-lock.json 与 src-tauri/Cargo.lock，
      # 然后把这里换成 `npm ci`，构建步骤换成 Cargo `--locked`（或 tauri build -- --locked）。
      # 有 lock 时下面的分支已经会走 npm ci。
      - name: 安装前端依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      # TODO(m2b): Cargo.lock 提交后追加 --locked，保证依赖可复现。
      - name: 构建（--no-bundle）
        run: npm run tauri build -- --no-bundle

      # 上面已生成 ../dist，cargo test 的 build.rs（generate_context!）才有前端资源可用。
      - name: Rust 单元测试
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: 上传控制台 exe（供真机试跑）
        uses: actions/upload-artifact@v4
        with:
          name: vega-console-windows
          path: console/src-tauri/target/release/vega-console.exe
          if-no-files-found: error
          retention-days: 14
