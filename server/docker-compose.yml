services:
  hbbs:
    container_name: vega-hbbs
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbs
    # 用 host 网络：Docker 的端口发布走 DNAT，不经过 UFW 的 INPUT 规则，
    # 从而绕过已有入站限制。host 网络下监听端口由服务自己决定，UFW 规则才有效。
    network_mode: host
    volumes:
      - ./data:/root
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: vega-hbbr
    image: rustdesk/rustdesk-server:1.1.16
    command: hbbr
    network_mode: host
    volumes:
      - ./data:/root
    restart: unless-stopped
