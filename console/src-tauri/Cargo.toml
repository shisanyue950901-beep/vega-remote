[package]
name = "vega-console"
version = "0.5.0"
description = "Vega 远程协助控制台（Tauri 2 外壳）"
authors = ["Vega Remote"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# 跨进程配置锁：Windows 走 LockFileEx，Unix 走 flock，句柄关闭即释放。
fs2 = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
