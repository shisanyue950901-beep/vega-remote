[package]
name = "vega-agent"
version = "0.1.0"
description = "Vega 访问码服务（vega-agent.exe）"
authors = ["Vega Remote"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
