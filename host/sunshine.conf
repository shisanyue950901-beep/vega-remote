# Vega Remote - Sunshine 设置模板
# install-host.ps1 只维护下面出现的这些键，配置文件里其余内容（你后来加的键）原样保留。
# 编码器保持自动探测：这里不写 encoder，Sunshine 会按显卡自己选 nvenc / amdvce / quicksync。

sunshine_name = Vega
adapter_name =

# 分辨率 / 刷新率跟随客户端，断开后恢复
dd_configuration_option = ensure_active
dd_resolution_option = auto
dd_refresh_rate_option = auto
dd_config_revert_delay = 3000

# 管理页只允许本机访问（远程改配置请先走 Tailscale 再在机器上操作）
origin_web_ui_allowed = pc

# 同时监听 IPv4 与 IPv6
address_family = both
