# Vega Remote - Sunshine 配置模板
# install-host.ps1 会把 __ADAPTER__ 替换为检测到的首选显卡

sunshine_name = Vega

# 编码器留空 = 自动探测 (nvenc / amdvce / quicksync / software)
# encoder =
adapter_name = __ADAPTER__

# 分辨率/刷新率跟随客户端，断开后恢复 (Sunshine 2025.x 及以上)
dd_configuration_option = ensure_active
dd_resolution_option = auto
dd_refresh_rate_option = auto
dd_config_revert_delay = 3000

# 画质
hevc_mode = 0
av1_mode = 0
min_threads = 2

# 管理页只允许局域网访问；串流本身不受此限制
origin_web_ui_allowed = lan
upnp = disabled
